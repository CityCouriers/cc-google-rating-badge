name: CI

# Kontrole kodu PHP wtyczki oraz skryptów procesu repozytorium. Każdy job kontrolny jest wymieniony
# w scripts/quality/quality-gate.js, a test pilnuje zgodności tej listy z tym plikiem. Ochrona `main`
# wymaga jednej kontroli, `quality-gate` (zob. README, sekcja Proces).
#
# CodeQL NIE obsługuje PHP, więc nie zastępuje żadnej z tych kontroli. Rolę kontroli bezpieczeństwa
# pełnią: reguły WordPress.Security w PHPCS (job phpcs), audyt zależności i skan wzorców kodu
# (job security) oraz skan sekretów gitleaks (job secret-scan). Opis i ograniczenia: README.

on:
  pull_request:
    # ready_for_review: po zmianie z Draft na Ready powstaje świeży przebieg na bieżącym HEAD.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Wersja PHP dla narzędzi (PHPCS, PHPStan, budowa zipa). Kod wtyczki działa od PHP 7.4 (job lint, phpcompat).
  # Akcja shivammathur/setup-php (spoza actions/*) jest przypięta do SHA commitu tagu 2.40.0.
  TOOLS_PHP: "8.3"

jobs:
  phpcs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ env.TOOLS_PHP }}
          coverage: none
          tools: composer:v2
      - name: Install dev tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  phpcompat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ env.TOOLS_PHP }}
          coverage: none
          tools: composer:v2
      - name: Install dev tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPCompatibilityWP, kod wtyczki (PHP 7.4 i nowsze)
        run: vendor/bin/phpcs --standard=phpcompat.xml.dist
      - name: PHPCompatibilityWP, testy i skrypty (PHP 8.0 i nowsze)
        run: vendor/bin/phpcs --standard=PHPCompatibilityWP --runtime-set testVersion 8.0- --extensions=php tests scripts

  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ env.TOOLS_PHP }}
          coverage: none
          tools: composer:v2
      - name: Install dev tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  # Składnia kodu wtyczki na całym deklarowanym zakresie wersji PHP (7.4-8.4). Testy wymagają PHP 8.0+,
  # więc na 7.4 sprawdzamy tylko składnię; zgodność semantyki na 7.4 pilnuje PHPCompatibilityWP.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l
        run: |
          set -euo pipefail
          php -l cc-google-rating-badge.php
          php -l uninstall.php

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: zip
      - name: Testy wtyczki i skryptów (tests/*-test.php)
        run: |
          set -euo pipefail
          for t in tests/*-test.php; do
            echo "== $t"
            php "$t"
          done

  # Kontrola bezpieczeństwa, wzorce i zależności. Nie jest analizą przepływu danych (tej PHP nie dostaje
  # z CodeQL); wyłapuje znane groźne konstrukcje, nieoczekiwane adresy wychodzące i znane podatności zależności.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ env.TOOLS_PHP }}
          coverage: none
          tools: composer:v2
      - name: Dependency audit (composer.lock)
        run: composer audit --locked --no-interaction
      - name: Skan wzorców kodu wtyczki
        run: php scripts/security-patterns.php

  # Budowa zipa do wgrania w wp-admin: dwa przebiegi muszą dać identyczny plik (powtarzalność).
  release-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ env.TOOLS_PHP }}
          coverage: none
      - name: Zbuduj zip dwa razy i porównaj
        run: |
          set -euo pipefail
          php scripts/build-zip.php --out dist/a
          php scripts/build-zip.php --out dist/b
          sha256sum dist/a/*.zip dist/b/*.zip
          test "$(sha256sum dist/a/*.zip | cut -d' ' -f1)" = "$(sha256sum dist/b/*.zip | cut -d' ' -f1)"
      - name: Zip jako artefakt przebiegu
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: dist/a/*.zip
          if-no-files-found: error
          retention-days: 14

  process-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Testy skryptów procesu (bramka audytu, etykiety, quality-gate)
        run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks-action w organizacji wymaga licencji (GITLEAKS_LICENSE); sam skaner jej nie wymaga.
      # Wersja i SHA-256 jak w CityCouriers/wordpress-automation (zgodne z gitleaks_8.30.1_checksums.txt wydania).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Bez --first-parent i --no-merges, bo pomijają commity boczne i zmiany w samym merge'u.
          # --diff-merges=first-parent pokazuje merge wobec pierwszego rodzica, także rozwiązanie konfliktu.
          scope=--all
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="${BASE_SHA}..${HEAD_SHA}"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--diff-merges=first-parent $scope" .

  # Job zbiorczy: jedna kontrola wymagana przez `main`. Zielony tylko, gdy każdy job z listy wymaganych ma wynik
  # `success` (pominięty, anulowany i brakujący dają czerwony); lista jest w scripts/quality/quality-gate.js,
  # a test pilnuje jej zgodności z tym plikiem. `needs` działa tylko w obrębie tego workflow, więc nowe joby
  # kontrolne dopisujemy tutaj i w skrypcie.
  quality-gate:
    name: quality-gate
    if: always()
    needs: [phpcs, phpcompat, phpstan, lint, tests, security, release-zip, process-tests, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Evaluate required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: node scripts/quality/quality-gate.js
